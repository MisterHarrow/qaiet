name: run

# Two kinds of run share this workflow and the database:
#   collect - every 2 hours: fetch every source and save the database. No model calls, no deploy.
#             Keeps high-volume feeds complete (some list fewer items than they publish in a day).
#   publish - every morning from 06:30 Stockholm: collect, then relevance, stories, labels,
#             summaries, the daily edition read aloud, the site; save, commit editions, deploy.
#   deploy  - manual only: rebuild the site from the saved database (no model calls) and deploy.
#             For page changes. Run it after the morning publish: the rebuilt page carries the
#             current time, so before 06:30's publish it would look like today's edition.
# The site lives on Vercel at news.b3njamin.ai. GitHub Pages (the old address) only serves a
# redirect there, from deploy/pages-redirect/.
# GitHub drops scheduled runs under load, so .github/scripts/plan.sh doesn't trust any single
# cron: any scheduled run publishes once it's past 06:30 in Stockholm and the live page doesn't
# have today's edition yet. The morning cron retries every 20 minutes (UTC 04-09 covers 06:30
# local in both winter and summer time); otherwise those runs skip in a few seconds.
# Manual runs (Actions tab) publish by default; pick "collect" to only fetch, "deploy" to only redeploy.
on:
  schedule:
    - cron: "17 */2 * * *"          # collect (and publish, if this morning's edition is still missing)
    - cron: "10,30,50 4-9 * * *"    # morning: publish when due, otherwise skip
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        options: [publish, collect, deploy]
        default: publish

permissions:
  contents: write   # commit frozen editions, store the database as a release asset
  pages: write
  id-token: write

concurrency:
  group: quiet-ai-run      # never two runs on the same database
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            config/settings.yaml
          sparse-checkout-cone-mode: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          COLLECT_CRON: "17 */2 * * *"
          SITE_URL: https://news.b3njamin.ai
        run: |
          mode=$(.github/scripts/plan.sh)
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "This run: $mode (Stockholm time $(TZ=Europe/Stockholm date +%H:%M))"

  run:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}        # GitHub search: 30 requests/min instead of 10
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0   # astral publishes no major-version tags
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Cache the embedding model
        if: env.MODE == 'publish'
        uses: actions/cache@v6
        with:
          path: .cache/fastembed
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2

      - name: Restore database
        run: |
          mkdir -p data
          if gh release download db --pattern quiet-ai.db.gz --dir data; then
            gunzip -f data/quiet-ai.db.gz
            ls -lh data/quiet-ai.db
          else
            echo "No saved database yet: starting fresh."
          fi

      # The spoken bulletins, so every rebuild keeps their players (and a second publish the same day doesn't
      # voice it again). The last 30 days are kept.
      - name: Restore audio
        if: env.MODE != 'collect'
        run: |
          mkdir -p data/audio
          gh release download audio --pattern 'bulletin-*' --dir data/audio 2>/dev/null || echo "No saved bulletins."

      - name: Install
        run: uv sync --frozen

      - name: Collect
        if: env.MODE == 'collect'
        run: uv run qa ingest

      # The speech keys are only in this step (qa run voices the day's bulletin with bulletin.tts_engine;
      # without its key it skips it).
      - name: Publish
        if: env.MODE == 'publish'
        env:
          SPEECHIFY_API_KEY: ${{ secrets.SPEECHIFY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          uv run qa run

      - name: Save audio
        if: env.MODE == 'publish'
        run: |
          # A failed bulletin keeps its script, so a later publish the same day voices it without a new one.
          shopt -s nullglob
          files=(data/audio/bulletin-$(TZ=Europe/Stockholm date +%F).*)
          if [ ${#files[@]} -eq 0 ]; then echo "No bulletin today."; exit 0; fi
          gh release view audio >/dev/null 2>&1 || gh release create audio --prerelease --title "Audio" \
            --notes "The spoken bulletins: one MP3 per day with its script and details, made by the morning publish. The last 30 days are kept."
          gh release upload audio "${files[@]}" --clobber
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%d)
          for asset in $(gh release view audio --json assets --jq '.assets[].name' | grep -E '^bulletin-[0-9-]+\.'); do
            day=${asset#bulletin-}; day=${day%%.*}
            if [[ "$day" < "$cutoff" ]]; then gh release delete-asset audio "$asset" -y; fi
          done

      # The energy desk's prices are one free request (no model calls), so a rebuilt page has today's figures
      # even when the code that shows them was merged after the morning publish.
      - name: Build the site only (no model calls)
        if: env.MODE == 'deploy'
        run: |
          uv run qa energy
          uv run qa build

      - name: Save database
        if: always() && env.MODE != 'deploy' && hashFiles('data/quiet-ai.db') != ''
        run: |
          gzip -kf data/quiet-ai.db
          gh release view db >/dev/null 2>&1 || gh release create db --prerelease --title "Database" \
            --notes "SQLite state of quiet-ai, replaced on every run. It holds only what the site shows: headlines, short summaries, links and the labels. Daily snapshots are kept for 14 days."
          gh release upload db data/quiet-ai.db.gz --clobber
          snapshot="quiet-ai-$(date -u +%Y-%m-%d).db.gz"
          cp data/quiet-ai.db.gz "$snapshot"
          gh release upload db "$snapshot" --clobber
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%d)
          for asset in $(gh release view db --json assets --jq '.assets[].name' | grep -E '^quiet-ai-[0-9-]+\.db\.gz$'); do
            day=${asset#quiet-ai-}; day=${day%.db.gz}
            if [[ "$day" < "$cutoff" ]]; then gh release delete-asset db "$asset" -y; fi
          done

      - name: Commit frozen editions
        if: env.MODE == 'publish'
        run: |
          git add editions
          if git diff --cached --quiet; then
            echo "No new frozen editions."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Freeze editions $(ls editions/*.json | tail -1 | xargs basename -s .json)"
            git pull --rebase --quiet
            git push
          fi

      # The old address, misterharrow.github.io/qaiet/, forwards to news.b3njamin.ai.
      - if: env.MODE == 'publish' || env.MODE == 'deploy'
        uses: actions/configure-pages@v6

      - if: env.MODE == 'publish' || env.MODE == 'deploy'
        uses: actions/upload-pages-artifact@v5
        with:
          path: deploy/pages-redirect

      # Vercel hosts the site at news.b3njamin.ai; it never builds anything itself.
      # The token stays in this one step.
      - name: Deploy to Vercel
        if: env.MODE == 'publish' || env.MODE == 'deploy'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::No VERCEL_TOKEN secret: the site can't be deployed."; exit 1; fi
          npx --yes vercel@66.6.0 deploy site --prod --yes --token "$VERCEL_TOKEN"

  deploy:
    needs: [plan, run]
    if: needs.plan.outputs.mode == 'publish' || needs.plan.outputs.mode == 'deploy'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
