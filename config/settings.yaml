# quiet-ai settings. Sources live in sources.yaml and accounts.yaml.

db_path: data/quiet-ai.db
# The scheduled workflow owns the data; qa pull fetches its latest database for local work.
db_release_url: https://github.com/MisterHarrow/qaiet/releases/download/db/quiet-ai.db.gz

http:
  # Sent with every request. Add a contact URL once the repo is public, e.g.
  # "quiet-ai/0.1 (+https://github.com/<owner>/qaiet)".
  user_agent: "quiet-ai/0.1 (daily AI news digest; respects robots.txt)"
  robots_token: quiet-ai          # name matched against robots.txt User-agent groups
  respect_robots: true
  timeout_s: 20
  max_retries: 2                  # on 429, 5xx and network errors
  backoff_base_s: 2
  max_retry_wait_s: 30
  min_interval_s: 1.0             # minimum gap between two requests to the same host
  host_min_interval_s:
    api.gdeltproject.org: 6       # GDELT asks for at most one request per 5 s
    public.api.bsky.app: 0.3
    huggingface.co: 0.5
  workers: 8                      # different hosts are fetched in parallel

ingest:
  title_max_chars: 300
  summary_max_chars: 500          # we store a short summary only, never full text
  max_age_days: 14                # skip dated items older than this (feeds often carry years of backlog);
                                  # repos/models/datasets/spaces are exempt (their date is a creation date)

github:
  # Search API: 10 requests/min without a token, 30/min with GITHUB_TOKEN.
  min_interval_s_unauthenticated: 6.5
  min_interval_s_token: 2.2
  per_page: 50
  created_within_days: 14         # "new repos" queries
  topics: [llm, large-language-models, ai-agents, generative-ai, mcp, rag, llm-inference, diffusion-models]
  established_topics: [llm, ai-agents]   # big repos still moving, for star velocity
  established_min_stars: 1000
  established_pushed_within_days: 2
  clone_spam_min: 3               # same repo name from this many owners = star-farmed spam, dropped

huggingface:
  trending_limit: 50
  papers_days: 2                  # today and yesterday
  posts_limit: 50

hackernews:
  window_hours: 48
  min_points: 20
  max_hits: 500

bluesky:
  posts_per_account: 30
  only_active: true               # poll only accounts with bluesky_active: true

openrouter:
  max_age_days: 14                # only models added in this window

gdelt:
  enabled: true
  timespan: 1d
  max_records: 250
  max_query_chars: 180            # longer queries are rejected; domains are split across queries
  source_lang: english            # English editions only (Xinhua etc. also publish in many languages)
  # GDELT rejects very short keywords, so no bare "AI".
  terms: ['"artificial intelligence"', OpenAI, chatbot, Nvidia, DeepSeek]

relevance:
  # Always about AI: builder items from AI-specific listings, and sources marked ai_focused in sources.yaml.
  always_kinds: [repo, model, dataset, space, paper, launch]
  always_sources: [hf_posts]
  llm_batch_size: 25              # ambiguous items per Haiku call
  prompt: relevance_v2            # src/quiet_ai/llm/prompts/<prompt>.md

embed:
  # Local ONNX model via fastembed, CPU. Multilingual: Swedish/German/French/Spanish headlines land
  # next to English ones without translation, and unrelated headlines score far lower than with
  # BAAI/bge-small-en-v1.5 (tested 2026-11-24).
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  cache_dir: .cache/fastembed
  summary_chars: 300              # title + start of summary is what gets embedded
  keep_days: 7                    # older vectors are deleted (story centroids are kept)

cluster:
  # Tuned 2026-11-24 on 1,900 items: 0.55 and below glued unrelated "AI and society" pieces into
  # one 100-item blob; 0.65 split the Huang story's market angle off. See docs/m2-notes.md.
  window_hours: 72                # rolling window of items considered
  join_threshold: 0.62            # cosine similarity to join an existing story...
  confident_threshold: 0.72       # ...below this, only when the item shares a name with the story
  strict_join_threshold: 0.8      # for repos, models, datasets, spaces, papers, launches
  strict_kinds: [repo, model, dataset, space, paper, launch]
  join_only_kinds: [recap]        # AINews X bullets: join a story by link or similarity, never start one
  merge_threshold: 0.76           # two stories this similar (and sharing a name or link) are merged
  entity_boost: 0.03              # added per shared name (company, product, person), max 2

momentum:
  # Counts (outlets, countries, aggregators, digests) are log-scaled against the window's maximum;
  # platform volumes (HN points, stars, HF trending, social) are percentile ranks so no one source
  # dominates. Weighted sum, halved every half_life_hours since the story's latest item. Weights sum to 1.
  half_life_hours: 36
  weights:
    outlets: 0.25                 # distinct news outlets
    countries: 0.10               # distinct outlet countries
    hn_points: 0.15               # Hacker News points
    star_velocity: 0.10           # GitHub stars gained per day
    hf_trending: 0.10             # Hugging Face trending score, paper upvotes
    social: 0.10                  # Bluesky and HF posts (plus likes and reposts), and X posts linked by AINews
    aggregators: 0.10             # led on Techmeme / Memeorandum
    digests: 0.10                 # picked up by AI digests (AINews, TLDR AI, The Batch, ...)

rising:
  window_hours: 48                # builder items seen in a listing this recently
  # Candidates per listing; on the page they are grouped by what they are (agent, model, tool, ...).
  quota: {repo: 10, model: 5, space: 3, dataset: 3, paper: 5}

analysis:
  label_batch_size: 20            # items per Haiku labeling call
  news_prompt: news_label_v3      # prompt files in src/quiet_ai/llm/prompts/; the version is stored on each label
  builder_prompt: builder_label_v1
  summary_prompt: story_summary_v3
  weather_prompt: weather_v3
  summarize_top: 12               # Sonnet summaries for the top stories only
  # Cost control: a big story gains items every run, so refresh its summary only when it grew by
  # about 30% (at least 3 items) or gained about 20% more outlets (at least 1), or its labels moved.
  resummarize_new_items: 3
  resummarize_growth: 0.3
  weather_min_hours: 6            # weather lines refresh when the top 3 stories change, else at most every 6 hours
  builder_label_top: 30           # what/why labels for this many Rising candidates
  stance_kinds: [news, newsletter]  # kinds that get track/frame/stance (newsletters: commentary only)
  top_stories: 12                 # story cards on the page (three rows of four)

llm:
  item_model: claude-haiku-5-5    # relevance, translation, item labels
  story_model: claude-sonnet-5-5  # story summaries (M3)
  monthly_budget_usd: 30          # hard cap: LLM steps are skipped once this month's spend reaches it
  prices:                         # USD per million tokens, for cost logging
    claude-haiku-5-5: {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
    claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}
    claude-opus-5-5: {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}   # qa eval crosscheck only

gap:
  # "Builders are talking, press isn't": at most quiet_max_outlets outlets, a builder signal in the
  # top 15% of the view and above one of the absolute floors. "Press is talking, builders aren't":
  # at least loud_min_outlets outlets and builder signals in the bottom quarter (usually none).
  max_items: 5
  quiet_max_outlets: 1
  builder_min_rank: 0.85
  builder_floors: {hn_points: 80, star_velocity: 150, hf_trending: 60}   # social posts alone don't count
  loud_min_outlets: 5
  builder_max_rank_quiet: 0.25

sentiment:
  # Daily index: mean stance per track. Each outlet's labels are averaged first (weighted by
  # confidence; low-confidence labels are left out), then outlets are averaged, so a high-volume
  # outlet counts as one voice.
  confidence_weights: {high: 1.0, medium: 0.7}
  min_outlets: 3
  recompute_days: 3

narratives:
  # A story the press (news and commentary; digests don't count) covered on min_days or more Stockholm days
  # in a row becomes a narrative, with a page that tells it day by day. No model calls: the numbers come from
  # the labels, the headlines from the day's articles and that morning's front page.
  min_days: 4
  ongoing_days: 1                 # "ongoing" while it was covered today or yesterday
  front_max: 6                    # ongoing narratives listed on the front page
  headlines_per_day: 3            # spread across the day's stance range

site:
  out_dir: site                   # qa build writes here; git-ignored
  editions_dir: editions          # frozen daily editions (JSON), committed by the workflow
  timezone: Europe/Stockholm      # dates and times on the page
  # Views the reader can switch between. The first is the front page; the others live at /<key>/.
  # Each view ranks stories by activity inside its period; half_life_hours sets how much the
  # recent part counts. Longer views merge stories that went quiet and came back (merge: true).
  periods:
    - {key: day, label: 24 hours, hours: 24, half_life_hours: 36}
    - {key: week, label: 7 days, hours: 168, half_life_hours: 96, merge: true}
    - {key: month, label: 30 days, hours: 720, half_life_hours: 360, merge: true}
    - {key: year, label: 1 year, hours: 8760, half_life_hours: 2160, merge: true}
  period_merge_threshold: 0.72    # centroid similarity for merging, plus at least one shared name
  period_merge_candidates: 300    # only the most active stories of a period are considered for merging
  # "Most mentioned" row in the header: names from the item labels in the period, counted once per outlet.
  terms_count: 16
  term_aliases:                   # lowercase variant -> the name to show
    donald trump: Trump
    trump administration: Trump
    president trump: Trump
    president donald trump: Trump
    united states: US
    u.s.: US
    usa: US
    u.s: US
    eu: EU
    european union: EU
    uk: UK
    united kingdom: UK
    britain: UK
  term_stopwords: [ai, artificial intelligence, a.i., generative ai, llm, llms, tech, technology, chatbot, chatbots]

schedule:
  # Describes .github/workflows/run.yml for the site's text (the workflow is what actually runs).
  collect_every_hours: 2          # fetch sources only, no model calls
  publish_at: "06:30"             # labels, summaries, the page and the daily edition
  timezone: Europe/Stockholm
