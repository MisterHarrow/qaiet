# Feed sources for quiet-ai (news outlets, aggregators, newsletters, lab blogs). Draft from M0 verification on 2026-11-24.
# Every feed below was fetched and parsed on that date and is allowed by the site's robots.txt.
# type: mainstream | trade | business | opinion | state-aligned | public-broadcaster
# group: which seed-list bucket in the brief it came from (for the bias audit, never shown as a label).
# Round 2 (same day): X and paid sources dropped; aggregators, newsletters and lab blogs added.
# llm: false = never send this source's text to the LLM (publisher opted out via Content-Signal).
# gdelt_outlets: outlets with no usable feed, read through the GDELT DOC API instead (headline, URL, date only).
#   Rate-limited from the dev machine on 2026-11-24; retest from GitHub Actions.
# type also allows `wire` (news agencies).
# sitemap: for sources with no feed. Only URLs modified within ingest.max_age_days and not seen before are read.
# ai_focused: true = an AI-only feed (AI section, AI newsletter, lab blog); its items skip the relevance check.
# index_from: date = this outlet's labels count in the sentiment index from that day. Optional; Benjamin chose no
#   wait for new languages (2026-11-26; docs/global-coverage-plan.md), so no source sets it today.
